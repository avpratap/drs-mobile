name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Generated code is up to date
        run: |
          melos run gen
          git diff --exit-code -- '*.g.dart' || (echo "Run 'melos run gen' and commit the result." && exit 1)

      - name: Analyze
        run: melos run analyze

      - name: Test
        run: melos run test

  build-android:
    name: Android ${{ matrix.target.flavor }} ${{ matrix.target.mode }} (${{ matrix.app }})
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, delivery_app]
        # dev debug APK for testers; prod release bundle proves the store
        # configuration (flavor, R8, signing fallback) builds.
        target:
          - { flavor: dev, mode: debug }
          - { flavor: prod, mode: release }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build dev debug APK
        if: matrix.target.mode == 'debug'
        working-directory: apps/${{ matrix.app }}
        # No secrets needed: every --dart-define defaults to empty.
        run: flutter build apk --debug --flavor ${{ matrix.target.flavor }}

      - name: Build prod release app bundle (no keystore -> debug-signed)
        if: matrix.target.mode == 'release'
        working-directory: apps/${{ matrix.app }}
        run: flutter build appbundle --release --flavor ${{ matrix.target.flavor }}

      - uses: actions/upload-artifact@v4
        if: matrix.target.mode == 'debug'
        with:
          name: ${{ matrix.app }}-${{ matrix.target.flavor }}-debug-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-${{ matrix.target.flavor }}-debug.apk
          retention-days: 7

  build-ios:
    name: iOS ${{ matrix.target.flavor }} ${{ matrix.target.mode }}, no codesign (${{ matrix.app }})
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, delivery_app]
        target:
          - { flavor: dev, mode: debug }
          - { flavor: prod, mode: release }
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build iOS (unsigned)
        working-directory: apps/${{ matrix.app }}
        run: >-
          flutter build ios --${{ matrix.target.mode }} --no-codesign
          --flavor ${{ matrix.target.flavor }}
