  image_picker: ^1.2.4
  path: ^1.9.0
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
