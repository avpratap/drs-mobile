name: delivery_app
description: DRS delivery app — daily route and proof of delivery for DRS riders.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  drs_api: ^0.1.0
  drs_core: ^0.1.0
  drs_ui: ^0.1.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_secure_storage: ^11.2.0
