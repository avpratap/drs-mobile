name: delivery_app
description: DRS delivery app — daily route and proof of delivery for DRS riders.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  dio: ^5.11.1
  drs_api: ^0.1.0
  drs_core: ^0.1.0
  drs_ui: ^0.1.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
