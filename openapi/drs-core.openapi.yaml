# DRS core API — mobile subset of the drs-backend contract.
#
# Derived by hand from avpratap/drs-backend `app/api/v1/*` + `app/schemas/*`
# (commit b6fb39c; milestone 2 additions: variants, addresses, payments,
# create_order, set_override, track_order; milestone 3: delivery_route,
# deliver_order, fail_delivery_order, upload_pod_asset). Every operationId is copied VERBATIM from the FastAPI route
# so this file stays a strict subset of the server-generated spec.
#
# Replace with the real export as soon as possible:
#   make api-spec BACKEND_DIR=../drs-backend   # dumps app.openapi() -> openapi/drs-backend.openapi.json
#   make api-gen                                # regenerates packages/drs_api
openapi: 3.1.0
info:
  title: DRS API (mobile subset)
  version: 0.1.0
servers:
  - url: http://localhost:8000
    description: Local dev. Real base URL is injected via --dart-define=DRS_API_BASE_URL.
security:
  - HTTPBearer: []
tags:
  - name: auth
  - name: products
  - name: cart
  - name: subscriptions
  - name: billing
  - name: orders
  - name: account
  - name: delivery
  - name: payments
paths:
  # ---------------------------------------------------------------- auth
  /api/v1/auth/otp/request:
    post:
      tags: [auth]
      operationId: request_otp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OTPRequest' }
      responses:
        '200':
          description: OTP sent (dev_otp present only in non-prod when no SMS was sent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OTPRequestResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verify_otp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OTPVerify' }
      responses:
        '200':
          description: Access + refresh JWT pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Refresh-token family revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetailOut' }
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: get_me
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserOut' }
        '401': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- products
  /api/v1/products:
    get:
      tags: [products]
      operationId: list_products
      security: []
      parameters:
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - name: sort
          in: query
          required: false
          description: newest | rating | name (default id asc)
          schema: { type: string }
        - { name: perishable, in: query, required: false, schema: { type: boolean } }
        - { name: in_stock, in: query, required: false, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Active products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductOut' }
  /api/v1/products/categories:
    get:
      tags: [products]
      operationId: list_product_categories
      security: []
      responses:
        '200':
          description: Distinct categories among active products
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /api/v1/products/{product_id}:
    get:
      tags: [products]
      operationId: get_product
      security: []
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductOut' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/products/{product_id}/full:
    get:
      tags: [products]
      operationId: get_product_full
      security: []
      parameters:
        - { name: product_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Product with its active pack-size variants (storefront-priced)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductFullOut' }
        '404': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- cart
  /api/v1/cart:
    get:
      tags: [cart]
      operationId: get_cart
      responses:
        '200':
          description: Active cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartOut' }
  /api/v1/cart/items:
    post:
      tags: [cart]
      operationId: add_cart_item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemIn' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartOut' }
  /api/v1/cart/items/{item_id}:
    patch:
      tags: [cart]
      operationId: set_cart_item_qty
      parameters:
        - { name: item_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemQtyIn' }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartOut' }
    delete:
      tags: [cart]
      operationId: remove_cart_item
      parameters:
        - { name: item_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartOut' }
  /api/v1/cart/quote:
    post:
      tags: [cart]
      operationId: cart_quote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteIn' }
      responses:
        '200':
          description: Pre-pay quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteOut' }
  /api/v1/cart/checkout:
    post:
      tags: [cart]
      operationId: checkout_cart
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutIn' }
      responses:
        '200':
          description: Created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOut' }

  # ---------------------------------------------------------------- subscriptions
  /api/v1/subscriptions:
    get:
      tags: [subscriptions]
      operationId: list_subscriptions
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Caller's subscriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubscriptionOut' }
    post:
      tags: [subscriptions]
      operationId: create_subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionCreate' }
      responses:
        '200':
          description: Created subscription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionOut' }
  /api/v1/subscriptions/{sub_id}:
    get:
      tags: [subscriptions]
      operationId: get_subscription
      parameters:
        - { $ref: '#/components/parameters/SubId' }
      responses:
        '200':
          description: Subscription with items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
  /api/v1/subscriptions/{sub_id}/items:
    put:
      tags: [subscriptions]
      operationId: set_subscription_items
      parameters:
        - { $ref: '#/components/parameters/SubId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/SubscriptionItemIn' }
      responses:
        '200':
          description: Subscription with items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionDetail' }
  /api/v1/subscriptions/{sub_id}/overrides:
    post:
      tags: [subscriptions]
      operationId: set_override
      parameters:
        - { $ref: '#/components/parameters/SubId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideIn' }
      responses:
        '200':
          description: Override saved (override_qty 0 = skip that day)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverrideSavedOut' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/subscriptions/{sub_id}/pause:
    post:
      tags: [subscriptions]
      operationId: pause_subscription
      parameters:
        - { $ref: '#/components/parameters/SubId' }
      responses:
        '200':
          description: Paused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionOut' }
  /api/v1/subscriptions/{sub_id}/resume:
    post:
      tags: [subscriptions]
      operationId: resume_subscription
      parameters:
        - { $ref: '#/components/parameters/SubId' }
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionOut' }
  /api/v1/subscriptions/{sub_id}/cancel:
    post:
      tags: [subscriptions]
      operationId: cancel_subscription
      parameters:
        - { $ref: '#/components/parameters/SubId' }
      responses:
        '200':
          description: Cancelled (terminal)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionOut' }
  /api/v1/subscriptions/{sub_id}/plan:
    get:
      tags: [subscriptions]
      operationId: get_subscription_plan
      parameters:
        - { $ref: '#/components/parameters/SubId' }
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Effective quantities for a date (default tomorrow, IST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanOut' }

  # ---------------------------------------------------------------- billing / wallet
  /api/v1/billing/me:
    get:
      tags: [billing]
      operationId: my_billing
      responses:
        '200':
          description: Wallet + credit summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSummary' }
  /api/v1/billing/transactions:
    get:
      tags: [billing]
      operationId: my_wallet_transactions
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Wallet ledger, newest first (total in X-Total-Count)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WalletTxnLineOut' }

  # ---------------------------------------------------------------- orders
  /api/v1/orders:
    post:
      tags: [orders]
      operationId: create_order
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '200':
          description: Created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOut' }
    get:
      tags: [orders]
      operationId: list_orders
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Caller's orders, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderOut' }
  /api/v1/orders/{order_id}:
    get:
      tags: [orders]
      operationId: get_order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOut' }
  /api/v1/orders/{order_id}/cancel:
    post:
      tags: [orders]
      operationId: cancel_order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderOut' }

  /api/v1/orders/{order_id}/tracking:
    get:
      tags: [orders]
      operationId: track_order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: Order + payment state and courier shipments with events (newest first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderTrackingOut' }

  # ---------------------------------------------------------------- payments
  /api/v1/payments/create:
    post:
      tags: [payments]
      operationId: create_payment
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentCreate' }
      responses:
        '200':
          description: Gateway order to open in Razorpay checkout (key_id "" = dev stub)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentCreateOut' }
        '409': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/v1/payments/verify:
    post:
      tags: [payments]
      operationId: verify_payment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentVerify' }
      responses:
        '200':
          description: Payment finalized (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentVerifyOut' }
        '400': { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- account
  /api/v1/profile:
    get:
      tags: [account]
      operationId: get_profile
      responses:
        '200':
          description: Caller's profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileOut' }

  /api/v1/addresses:
    get:
      tags: [account]
      operationId: list_addresses
      responses:
        '200':
          description: Caller's saved delivery addresses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AddressOut' }
    post:
      tags: [account]
      operationId: create_address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressIn' }
      responses:
        '201':
          description: Created address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressOut' }
  /api/v1/addresses/{address_id}/default:
    post:
      tags: [account]
      operationId: set_default_address
      parameters:
        - { name: address_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Address now default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddressOut' }

  # ---------------------------------------------------------------- delivery (staff)
  /api/v1/delivery/orders:
    get:
      tags: [delivery]
      operationId: list_delivery_orders
      parameters:
        - name: date
          in: query
          required: false
          description: Delivery date (default tomorrow, IST)
          schema: { type: string, format: date }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Delivery orders for the date, scoped to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeliveryOrderOut' }
  /api/v1/delivery/orders/route:
    get:
      tags: [delivery]
      operationId: delivery_route
      parameters:
        - name: date
          in: query
          required: false
          description: Delivery date (default tomorrow, IST)
          schema: { type: string, format: date }
      responses:
        '200':
          description: The caller's assigned stops as an ordered route
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouteStopOut' }
  /api/v1/delivery/orders/{order_id}/deliver:
    post:
      tags: [delivery]
      operationId: deliver_order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverRequest' }
      responses:
        '200':
          description: Stop marked delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryOrderOut' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/delivery/orders/{order_id}/fail:
    post:
      tags: [delivery]
      operationId: fail_delivery_order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/OptionalIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FailIn' }
      responses:
        '200':
          description: Stop marked failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryOrderOut' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/delivery/uploads:
    post:
      tags: [delivery]
      operationId: upload_pod_asset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Stored privately (EXIF stripped); pass `url` as pod.photo_url
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadOut' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/delivery/summary:
    get:
      tags: [delivery]
      operationId: delivery_summary
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200':
          description: Day summary for the driver
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverySummaryOut' }

components:
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Offset:
      { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
    SubId:
      { name: sub_id, in: path, required: true, schema: { type: integer } }
    OrderId:
      { name: order_id, in: path, required: true, schema: { type: integer } }
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opt-in at-most-once execution (the backend middleware replays a stored 2xx).
      schema: { type: string, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; a retried request replays instead of re-applying.
      schema: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DetailOut' }
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HTTPValidationError' }
  schemas:
    DetailOut:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items: { type: string }
        msg: { type: string }
        type: { type: string }
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items: { $ref: '#/components/schemas/ValidationErrorItem' }
    # auth
    OTPRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+?\d{10,15}$' }
    OTPRequestResponse:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        dev_otp: { type: string, nullable: true }
    OTPVerify:
      type: object
      required: [phone, otp]
      properties:
        phone: { type: string }
        otp: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, default: bearer }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    UserOut:
      type: object
      required: [id, phone, role, status]
      properties:
        id: { type: integer }
        phone: { type: string }
        role: { type: string }
        full_name: { type: string, nullable: true }
        status: { type: string }
    # products
    ProductOut:
      type: object
      required: [id, sku, name, status]
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        uom: { type: string, default: piece }
        pack_size: { type: number, default: 1 }
        is_subscribable: { type: boolean, default: true }
        perishable: { type: boolean, default: true }
        hsn_code: { type: string, nullable: true }
        gst_rate: { type: number, default: 0 }
        category: { type: string, nullable: true }
        image_url: { type: string, nullable: true }
        status: { type: string }
        from_price: { type: number, nullable: true, description: 'Lowest GST-inclusive retail price (INR)' }
        avg_rating: { type: number, default: 0 }
        rating_count: { type: integer, default: 0 }
        weight_kg: { type: number, nullable: true }
        length_cm: { type: number, nullable: true }
        width_cm: { type: number, nullable: true }
        height_cm: { type: number, nullable: true }
    # cart
    CartItemIn:
      type: object
      required: [product_id, qty]
      properties:
        product_id: { type: integer }
        qty: { type: number, exclusiveMinimum: 0, maximum: 100000 }
    CartItemQtyIn:
      type: object
