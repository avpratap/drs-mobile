    RouteStopOut:
      type: object
      required: [sequence, order]
      properties:
        sequence: { type: integer }
        order: { $ref: '#/components/schemas/DeliveryOrderOut' }
    DeliverItem:
      type: object
      required: [product_id, qty_delivered]
      properties:
        product_id: { type: integer }
        qty_delivered: { type: number, minimum: 0, maximum: 100000 }
