        days_of_week: { type: string, nullable: true, description: 'CSV of ISO weekdays, e.g. "1,3,5"' }
    SubscriptionItemOut:
      type: object
      required: [id, product_id, default_qty, active]
      properties:
        id: { type: integer }
        product_id: { type: integer }
        default_qty: { type: number }
        frequency: { type: string, default: daily }
        interval_days: { type: integer, nullable: true }
        days_of_week: { type: string, nullable: true }
        active: { type: boolean }
    SubscriptionOut:
      type: object
      required: [id, shop_id, account_id, status, start_date]
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        account_id: { type: integer }
        status: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
