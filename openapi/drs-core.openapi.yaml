        qty_delivered: { type: number }
        unit_price: { type: number }
        line_total: { type: number }
        status: { type: string }
    DeliveryOrderOut:
      type: object
      required: [id, delivery_date, shop_id, origin, status, subtotal, total, amount_due]
      properties:
