      type: object
      required: [subtotal, discount, tax_total, total, total_incl_tax]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuoteLineOut' }
        subtotal: { type: number }
        discount: { type: number }
        tax_total: { type: number }
        total: { type: number }
        total_incl_tax: { type: number }
        serviceable: { type: boolean, nullable: true }
        etd_days: { type: integer, nullable: true }
        shipping_rate: { type: number, nullable: true }
    CheckoutIn:
      type: object
      properties:
        address: { type: string, nullable: true, maxLength: 1024 }
        state: { type: string, nullable: true, maxLength: 120 }
        pincode: { type: string, nullable: true }
        coupon_code: { type: string, nullable: true, maxLength: 32 }
    # orders
    OrderItemOut:
      type: object
      required: [product_id, qty, unit_price, line_total]
      properties:
        product_id: { type: integer }
        qty: { type: number }
        unit_price: { type: number }
        line_total: { type: number }
        gst_rate: { type: number, default: 0 }
        gst_amount: { type: number, default: 0 }
        price_incl_tax: { type: number, default: 0 }
    OrderOut:
      type: object
      required: [id, order_no, shop_id, order_type, status, subtotal, total, payment_status]
      properties:
        id: { type: integer }
        order_no: { type: string }
        shop_id: { type: integer }
        order_type: { type: string }
        status: { type: string }
        subtotal: { type: number }
        discount: { type: number, default: 0 }
        coupon_code: { type: string, nullable: true }
        total: { type: number }
        payment_status: { type: string }
        tax_total: { type: number, default: 0 }
        total_incl_tax: { type: number, default: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemOut' }
