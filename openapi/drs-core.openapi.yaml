      type: object
      required: [id, shop_id, account_id, status, start_date]
      properties:
        id: { type: integer }
        shop_id: { type: integer }
        account_id: { type: integer }
        status: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionItemOut' }
