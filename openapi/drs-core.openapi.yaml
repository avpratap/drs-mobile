      type: object
      required: [date, delivered, failed, pending, cash_collected]
      properties:
        date: { type: string, format: date }
        delivered: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        cash_collected: { type: number }
    # milestone 2
    VariantOut:
      type: object
      required: [id, product_id, sku, label, pack_size, price, status, sort_order]
