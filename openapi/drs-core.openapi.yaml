      type: object
      properties:
        recipient_name: { type: string, nullable: true, maxLength: 255 }
        photo_url: { type: string, nullable: true, maxLength: 512, description: 'media:… ref from upload_pod_asset, or https URL' }
        signature_url: { type: string, nullable: true, maxLength: 512 }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        note: { type: string, nullable: true, maxLength: 255 }
