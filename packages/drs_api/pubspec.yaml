name: drs_api
description: >-
  Typed DRS API client generated (openapi-generator dart-dio, json_serializable)
  from the drs-backend OpenAPI contract, plus a hand-written session layer.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  test: ^1.30.0
