name: drs_ui
description: DRS design system — the single shared ThemeData, brand tokens and core widgets.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  cached_network_image: ^4.0.6
  drs_core: ^0.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  riverpod: ^3.4.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # Widgets here use Material icons (also bundles the icon font for goldens).
  uses-material-design: true
  # Font licences, shown on the open-source licences page.
  assets:
    - assets/fonts/OFL-Poppins.txt
    - assets/fonts/OFL-Montserrat.txt
  # Bundled (OFL-licensed, see assets/fonts/OFL-*.txt) so the UI never fetches
  # fonts at runtime — works offline and makes no third-party requests.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
